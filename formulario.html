<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="contenedor">
        <h1>Formulario de contacto</h1>
        <p class="subtitulo"> Completá el formulario y nos pondremos en contacto con vos. </p>
        <form id="formulario">
            <div class="campo"> <label for="nombre">Nombre</label> <input type="text" id="nombre" name="nombre"
                    required> </div>
            <div class="campo"> <label for="apellido">Apellido</label> <input type="text" id="apellido"
                    name="apellido" required> </div>
            <div class="campo"> <label for="telefono">Teléfono</label> <input type="tel" id="telefono" name="telefono">
            </div>
            <div class="campo"> <label for="email">Email</label> <input type="email" id="email" name="email" required>
            </div>
            <div class="campo"> <label>Tipo de contacto</label>
                <div class="opciones"> <label class="opcion"> <input type="radio" name="tipoContacto" value="Soporte"
                            required> Soporte </label> <label class="opcion"> <input type="radio" name="tipoContacto"
                            value="Ventas"> Ventas </label> </div>
            </div>
            <div class="campo"> <label for="asunto">Asunto</label> <input type="text" id="asunto" name="asunto"
                    required> </div>
            <div class="campo"> <label for="descripcion">Descripción</label> <textarea id="descripcion"
                    name="descripcion" rows="5" required></textarea> </div> <button type="submit">Enviar
                formulario</button>
        </form>
        <div id="mensaje"></div>
    </div>
    <script src="index.js"></script>

</body>

</html>
